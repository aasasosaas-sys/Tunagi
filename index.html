.q{font-size:19px;font-weight:700;white-space:pre-line;overflow-wrap:anywhere}

.opts{display:grid;gap:8px}
.opts button{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--cd))}
.opts button.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 20%,var(--cd))}
.fb{white-space:pre-line;font-size:14px}.r{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd);padding:6px 0;font-size:14px}
.r span:last-child{text-align:right;color:var(--mu)}

.hero h1{margin:0 0 4px;font-size:22px}.hero .mu{color:#fff;opacity:.88}
.card{box-shadow:0 1px 3px rgba(0,0,0,.07)}
.dk{border-left:5px solid var(--c,var(--ac))}
.bar i{background:var(--c,var(--ac));transition:width .3s}
.opts button{display:flex;gap:12px;align-items:center;font-size:16px;min-height:54px;transition:transform .1s}
.opts button:active{transform:scale(.98)}

const PNc={副:'副詞(句)',接:'接続詞(句)',前:'前置詞(句)',動:'動詞(句)',群:'群前置詞'},PNp={v:'動詞句',a:'副詞句',p:'前置詞句',j:'形容詞句',c:'接続詞句'},PNk={n:'名詞',v:'動詞',a:'副詞',p:'前置詞'};
const NM={c:PNc,p:PNp,k:PNk},DN={c:'① つなぎ語(接続)',p:'② 言い換え熟語',k:'③ 図表・重要キーワード'};
const TN={c:{cat:'種類を選ぶ',same:'同じ種類を選ぶ',mean:'表現→意味',rev:'意味→表現',pos:'品詞'},p:{para:'熟語→言い換え',prev:'言い換え→熟語',one:'1語の言い換え(動詞等)',part:'句動詞の小辞',mean:'熟語→意味',rev:'意味→熟語',pos:'品詞'},k:{mean:'語→意味',rev:'意味→語',pos:'品詞'}};
const ALL={c:[],p:[],k:[]};
CD.trim().split('\n').forEach(l=>{const[a,b,c]=l.split('|');c.split(';').forEach(s=>{const[e,m]=s.split('=');ALL.c.push({d:'c',cat:a,pos:b||0,e,m})})});
PD.trim().split('\n').forEach(l=>{const[e,a,m,p]=l.split('|');ALL.p.push({d:'p',e,alts:a.split('/'),m,pos:p})});
KD.trim().split('\n').forEach(l=>{const[g,p,c]=l.split('|');c.split(';').forEach(s=>{const[e,m]=s.split('=');ALL.k.push({d:'k',g,pos:p,e,m})})});
const CATS=[...new Set(ALL.c.map(x=>x.cat))],PART='about up down off out in on over into through for with to away across after by of at'.split(' ');
const R=a=>a[Math.random()*a.length|0],S=a=>[...a].sort(()=>Math.random()-.5);
const pr=(a,f,p)=>[...S(a.filter(p)),...S(a.filter(x=>!p(x)))].map(f),dis=(p,n,b)=>[...new Set(p)].filter(x=>!b.includes(x)).slice(0,n);
const key=i=>i.d+'|'+i.e,pn=i=>NM[i.d][i.pos]||'',sg=w=>!/[ ～\[]/.test(w);
let M={},W={};try{M=JSON.parse(localStorage.getItem('m2')||'{}');W=JSON.parse(localStorage.getItem('w2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('m2',JSON.stringify(M));localStorage.setItem('w2',JSON.stringify(W))}catch(e){}};
const sc=i=>M[key(i)]||0;
const TS=new Set(Object.entries(TN).flatMap(([d,o])=>Object.keys(o).map(t=>d+':'+t)));
function gen(it,t){
 const d=it.d,all=ALL[d],sm=all.filter(x=>x!==it&&x.m!=it.m),sp=x=>x.pos==it.pos,pc=x=>x.cat?x.cat==it.cat:sp(x);
 const ex=d=='c'?`${it.e} ＝ ${it.m}\n種類：${it.cat}${it.pos?'／'+pn(it):''}`:d=='p'?`${it.e} ＝ ${it.alts.join(' / ')}\n意味：${it.m}／${pn(it)}`:`${it.e} ＝ ${it.m}\n${pn(it)}／${it.g}`;
 const mk=(q,a,pool,ok)=>({q,a,ok:ok||[a],x:ex,b:t=='pos'?'':pn(it),o:S([a,...dis(pool,3,[a])])});
 if(t=='mean')return mk(`「${it.e}」の意味は？`,it.m,pr(sm,x=>x.m,pc));
 if(t=='rev')return mk(`「${it.m}」にあたる表現は？`,it.e,pr(sm,x=>x.e,pc),all.filter(x=>x.m==it.m).map(x=>x.e));
 if(t=='pos'){if(!it.pos||it.pos=='群')return null;const P=Object.keys(NM[d]).filter(k=>k!='群'),N=NM[d],o=d=='p'?[it.pos,...S(P.filter(k=>k!=it.pos)).slice(0,3)]:P;return{q:`「${it.e}」の品詞は？`,a:N[it.pos],ok:[N[it.pos]],x:ex,b:'',o:S(o).map(k=>N[k])}}
 if(t=='cat')return mk(`「${it.e}」はどの種類のつなぎ語？`,it.cat,CATS);
 if(t=='same'){const c=R(sm.filter(x=>x.cat==it.cat));if(!c)return null;return mk(`「${it.e}」と同じ種類(働き)のつなぎ語は？`,c.e,pr(sm.filter(x=>x.cat!=it.cat),x=>x.e,()=>1),sm.filter(x=>x.cat==it.cat).map(x=>x.e))}
 if(t=='para')return mk(`「${it.e}」の言い換えは？`,R(it.alts),pr(sm.filter(x=>!x.alts.some(y=>it.alts.includes(y))),x=>R(x.alts),sp),it.alts);
 if(t=='prev'){const a=R(it.alts);return mk(`「${a}」と言い換えられる熟語は？`,it.e,pr(sm.filter(x=>!x.alts.includes(a)),x=>x.e,sp),all.filter(x=>x.alts.includes(a)).map(x=>x.e))}
 if(t=='one'){const s=it.alts.filter(sg);if(!s.length)return null;return mk(`「${it.e}」を1語で言い換えると？`,R(s),pr(sm.filter(x=>!x.alts.some(y=>it.alts.includes(y))&&x.alts.some(sg)),x=>R(x.alts.filter(sg)),sp),s)}
 if(t=='part'){const m=/^(\S+) (about|up|down|off|out|in|on|over|into|through|for|with|to|away|across|after|by|of|at)( |$)/.exec(it.e);if(!m||it.pos!='v')return null;return mk(`${m[1]} (　　) ${it.e.slice(m[0].length)}\n＝ ${it.m}（${it.alts[0]}）`,m[2],S(PART))}
 return null}
function pick(){const ds=Object.keys(TN).filter(d=>Object.keys(TN[d]).some(t=>TS.has(d+':'+t)));return ds}
let Q=[],qi=0,okc=0,miss=[],N=10;
function start(weak){
 let pool=pick().flatMap(d=>ALL[d]);if(weak)pool=pool.filter(i=>W[key(i)]);
 if(!pool.length){alert(weak?'苦手な項目はまだありません':'出題タイプを選んでください');return}
 const sel=[];let p=[...pool];while(sel.length<Math.min(N||pool.length,pool.length)){const w=p.map(i=>4-sc(i)+(W[key(i)]?2:0)),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,k=0;while(r>w[k]){r-=w[k];k++}sel.push(p.splice(k,1)[0])}
 Q=[];sel.forEach(it=>{for(const t of S(Object.keys(TN[it.d]).filter(t=>TS.has(it.d+':'+t)))){const q=gen(it,t);if(q&&q.o.length>=3){q.it=it;Q.push(q);break}}});
 qi=0;okc=0;miss=[];show()}
const app=document.getElementById('app');
function show(){const q=Q[qi];app.innerHTML=`<div class=top><button class=g onclick=home()>✕ やめる</button><span>${qi+1}/${Q.length}</span><span>正解 ${okc}</span></div><div class=bar><i style="width:${qi/Q.length*100}%"></i></div><div class=card>${q.b?`<span class=badge>${q.b}</span><br>`:''}<div class=q>${q.q}</div></div><div class=opts>${q.o.map((o,k)=>`<button onclick=ans(${k})><b>${'ABCDE'[k]}</b><span>${o}</span></button>`).join('')}</div><div id=fb class=fb></div>`}
function ans(k){const q=Q[qi],ok=q.ok.includes(q.o[k]),it=q.it;
 document.querySelectorAll('.opts button').forEach((b,j)=>{b.disabled=true;if(q.ok.includes(q.o[j]))b.classList.add('ok');else if(j==k)b.classList.add('ng')});
 if(ok){okc++;M[key(it)]=Math.min(3,sc(it)+1);if(M[key(it)]>=3)delete W[key(it)]}else{M[key(it)]=0;W[key(it)]=1;miss.push(q)}save();
 document.getElementById('fb').innerHTML=`<div class=card><b style="color:var(--${ok?'ok':'ng'})">${ok?'⭕ 正解！':'❌ 不正解'}</b>　習熟度 <span class=stars>${'★'.repeat(sc(it))}${'☆'.repeat(3-sc(it))}</span><br>${q.x}</div><div class=sticky><button class=btn onclick=nx()>${qi+1<Q.length?'次へ（Enter）':'結果を見る'}</button></div>`}
function nx(){qi++;qi<Q.length?show():fin()}
function fin(){app.innerHTML=`<h1>結果 ${okc}/${Q.length}</h1>${miss.length?`<div class=card><b>間違えた項目</b>${miss.map(q=>`<div class=r><span>${q.it.e}</span><span>${q.it.m}</span></div>`).join('')}</div>`:'<div class=card>全問正解！🎉</div>'}<button class=btn onclick=start(0)>もう一度</button><button class="btn s" onclick=start(1)>苦手だけ復習</button><button class="btn s" onclick=home()>ホームへ</button>`}
function pct(d){const a=ALL[d];return Math.round(a.reduce((s,i)=>s+sc(i),0)/(3*a.length)*100)}
function setN(n){N=n;home()}function tg(b,k){TS.has(k)?TS.delete(k):TS.add(k);b.classList.toggle('on')}
function home(){const wn=Object.keys(W).length;app.innerHTML=`<div class=hero><h1>📘 英語 つなぎ語・言い換えマスター</h1><div class=mu>全${ALL.c.length+ALL.p.length+ALL.k.length}項目。各項目を★3(3回連続正解)にすると習得。間違えると★0に戻り優先出題されます。品詞つきで出題。</div></div><div class=card><b>1回の問題数</b><div class="chips cnt">${[5,10,20,30,50,0].map(n=>`<span class="chip ${N==n?'on':''}" onclick="setN(${n})">${n||'全部'}</span>`).join('')}</div></div>`+Object.keys(DN).map(d=>`<div class="card dk" style="--c:${{c:'#c2185b',p:'#1565c0',k:'#2e7d32'}[d]}"><b>${DN[d]}</b> <span class=mu>${ALL[d].length}項目・習熟 ${pct(d)}%</span><div class=bar><i style="width:${pct(d)}%"></i></div><div class=chips>${Object.entries(TN[d]).map(([t,n])=>`<span class="chip ${TS.has(d+':'+t)?'on':''}" onclick="tg(this,'${d}:${t}')">${n}</span>`).join('')}</div></div>`).join('')+`<button class=btn onclick=start(0)>${N||'全'}問スタート</button><button class="btn s" onclick=start(1)>苦手だけ出題（${wn}項目）</button><button class="btn s" onclick="list('c')">一覧を見る</button>`}
function list(d){app.innerHTML=`<div class=top><button class=g onclick=home()>← 戻る</button></div><div class=chips>${Object.keys(DN).map(k=>`<span class="chip ${k==d?'on':''}" onclick="list('${k}')">${DN[k]}</span>`).join('')}</div><div class=card>${ALL[d].map(i=>`<div class=r><span>${i.e}<br><small class=mu>${i.cat||pn(i)}${i.g?'／'+i.g:''}${i.cat&&i.pos?'／'+pn(i):''}</small></span><span>${i.alts?i.alts.join(' / ')+'<br>':''}${i.m}<br>${'★'.repeat(sc(i))}${'☆'.repeat(3-sc(i))}</span></div>`).join('')}</div>`}
home();
document.addEventListener('keydown',e=>{const b=document.querySelectorAll('.opts button');if(b.length&&!b[0].disabled&&'12345'.includes(e.key)&&b[e.key-1])ans(e.key-1);else if(e.key=='Enter'){const n=document.querySelector('.sticky .btn');if(n)n.click()}});
</script></body></html>
